<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Сундук воспоминаний</title>
<style>@font-face{font-family:'Klub';src:url('fonts/klub.ttf') format('truetype')}
:root{--bg:#10131c;--card:#1a1f2e;--ink:#eef1f8;--mute:#8d96ad;--acc:#ff9f43;--acc2:#b66dff}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(1200px 600px at 70% -10%,#2a1f4a,transparent),var(--bg);
color:var(--ink);font:17px/1.55 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
.wrap{max-width:760px;margin:0 auto;padding:28px 18px 64px}
h1{font-size:2.1rem;margin:.2em 0}h1 small{display:block;font-size:.95rem;color:var(--mute);font-weight:400}
.card{background:var(--card);border-radius:18px;padding:18px 20px;margin:18px 0;border:1px solid #262c40}
.hero{text-align:center;padding:26px 10px}.hero .big{font-size:4.2rem}
.msg{padding:10px 0;border-top:1px solid #262c40}.msg:first-of-type{border-top:0}
.msg b{color:var(--acc)}.msg time{color:var(--mute);font-size:.8rem;margin-left:6px}
a.btn,button{display:inline-block;background:linear-gradient(90deg,var(--acc),var(--acc2));color:#1a1030;border:0;
padding:11px 20px;border-radius:12px;font-weight:700;text-decoration:none;cursor:pointer;font-size:1rem}
input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid #333b57;background:#0f1220;color:var(--ink);font-size:1rem;margin:10px 0}
.plate{font-family:'Klub',monospace;font-size:2.2rem;letter-spacing:.12em;text-align:center;padding:16px;border-radius:14px;
background:#0d0f19;border:2px dashed var(--acc);color:#fff}
.mute{color:var(--mute);font-size:.9rem}#out img{max-width:100%;border-radius:14px;margin-top:14px}
</style></head>
<body><div class="wrap">
<h1>Сундук воспоминаний<small>вход только по ключу</small></h1>
<div class="card"><p>Табличка с ключом (часть 2):</p>
<div class="plate">c85hjcbrh</div>
<p class="mute">Ключ состоит из двух частей через дефис. Всё строчными. Первая часть была в гостевой книге.</p></div>
<div class="card"><label for="k">Ключ</label>
<input id="k" autocomplete="off" placeholder="часть1-часть2"><button id="go">Открыть сундук</button>
<p id="st" class="mute"></p><div id="out"></div></div>
<p><a href="index.html" class="mute">← назад к фан-клубу</a></p>
<script>
const ITER=200000;
document.getElementById('go').onclick=async()=>{
 const st=document.getElementById('st'),out=document.getElementById('out');out.innerHTML='';st.textContent='Подбираю замок…';
 try{
  const buf=new Uint8Array(await (await fetch('vault.enc')).arrayBuffer());
  const salt=buf.slice(0,16),iv=buf.slice(16,28),ct=buf.slice(28);
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(document.getElementById('k').value.trim()),'PBKDF2',false,['deriveKey']);
  const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:ITER,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv},key,ct);
  const url=URL.createObjectURL(new Blob([pt],{type:'image/png'}));
  st.textContent='Сундук открыт. Сохрани картинку (правая кнопка → «Сохранить как»).';
  out.innerHTML='<img id="prize" alt="сундук" src="'+url+'">';
 }catch(e){st.textContent='Замок не поддался. Ключ неверный.';}
};
</script></div></body></html>
